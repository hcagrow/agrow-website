<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agrow 카탈로그 | 한가람농업개발</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#00C87A">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
[data-theme="light"]{--bg:#F4F6F9;--bg2:#EAEDF2;--card:#fff;--t1:#0C1A2E;--t2:#3D5068;--t3:#7A8FA6;--bdr:rgba(12,26,46,0.09);--acc:#00C87A;--nav:rgba(244,246,249,0.96);--sh:0 2px 8px rgba(12,26,46,0.08),0 12px 32px rgba(12,26,46,0.1);--tog:#0C1A2E}
[data-theme="dark"]{--bg:#080F1C;--bg2:#0D1726;--card:#112035;--t1:#E8EFF8;--t2:#8BA4BE;--t3:#5A7A9A;--bdr:rgba(0,200,122,0.12);--acc:#00E5A0;--nav:rgba(8,15,28,0.96);--sh:0 2px 8px rgba(0,0,0,0.3),0 12px 32px rgba(0,0,0,0.3);--tog:#00E5A0}
body{background:var(--bg);color:var(--t1);font-family:'Noto Sans KR','Inter',sans-serif;display:flex;flex-direction:column;transition:background .3s,color .3s}

/* NAV - fixed height */
nav{position:relative;z-index:1000;flex-shrink:0;height:56px;display:flex;align-items:center;padding:0 4%;gap:12px;background:var(--nav);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr)}
.nav-logo{font-family:'Inter',sans-serif;font-size:19px;font-weight:900;color:var(--acc);letter-spacing:-1px;text-decoration:none}
.nav-sub{font-size:10px;color:var(--t3);letter-spacing:1.5px;white-space:nowrap}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.back-btn{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:100px;border:1.5px solid var(--bdr);background:transparent;color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;transition:all .2s;white-space:nowrap}
.back-btn:hover{border-color:var(--acc);color:var(--acc)}
.tog{width:54px;height:28px;border-radius:14px;border:1px solid var(--bdr);cursor:pointer;background:#E3E9F0;position:relative;transition:background .3s;flex-shrink:0;padding:0}
[data-theme="dark"] .tog{background:#1B2A40}
.tog .tb{position:absolute;top:50%;width:13px;height:13px;margin-top:-6.5px;opacity:.45;pointer-events:none}
.tog .tb.s{left:7px;color:#C98A00}.tog .tb.m{right:7px;color:#5A6B82}
.tog-k{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .3s,background .3s;pointer-events:none}
[data-theme="dark"] .tog-k{transform:translateX(26px);background:#0C1A2E}
.tog-k svg{width:14px;height:14px}
.tog-k .i-s{color:#F5A623}.tog-k .i-m{color:#FFD95A;display:none}
[data-theme="dark"] .tog-k .i-s{display:none}[data-theme="dark"] .tog-k .i-m{display:block}

/* TAB BAR - fixed height */
.tab-bar{flex-shrink:0;display:flex;gap:6px;padding:10px 4%;background:var(--bg2);border-bottom:1px solid var(--bdr);flex-wrap:wrap}
.tab-btn{padding:6px 16px;border-radius:100px;border:1.5px solid var(--bdr);background:var(--card);color:var(--t3);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.tab-btn.on{background:var(--t1);color:#fff;border-color:var(--t1)}
[data-theme="dark"] .tab-btn.on{background:var(--acc);color:#080F1C;border-color:var(--acc)}
.tab-btn:hover:not(.on){border-color:var(--acc);color:var(--acc)}

/* MAIN - fills remaining height, NO scroll */
.main{flex:1;display:grid;grid-template-columns:1fr 200px;gap:0;overflow:hidden;min-height:0}
@media(max-width:860px){.main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.sidebar{display:none!important}}

/* VIEWER - fills height */
.viewer{display:flex;flex-direction:column;padding:16px;gap:10px;overflow:hidden;min-height:0}

/* STAGE - fills viewer, image fits inside */
.stage{flex:1;position:relative;background:var(--card);border-radius:10px;border:1px solid var(--bdr);box-shadow:var(--sh);overflow:hidden;min-height:0;display:flex;align-items:center;justify-content:center}
.stage img{max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity .3s;position:absolute}
.stage img.show{opacity:1}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--t3)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--sh);transition:all .2s;z-index:5;flex-shrink:0}
.arrow:hover{background:var(--acc);border-color:var(--acc)}
.arrow:hover svg{stroke:#fff}
[data-theme="dark"] .arrow:hover svg{stroke:#080F1C}
.arrow svg{width:18px;height:18px;stroke:var(--t2);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.arr-l{left:8px}.arr-r{right:8px}

/* CONTROLS - fixed */
.controls{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:8px}
.ctrl-btn{padding:7px 16px;border-radius:100px;border:1.5px solid var(--bdr);background:var(--card);color:var(--t2);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.ctrl-btn:hover:not(:disabled){background:var(--t1);color:#fff;border-color:var(--t1)}
[data-theme="dark"] .ctrl-btn:hover:not(:disabled){background:var(--acc);color:#080F1C;border-color:var(--acc)}
.ctrl-btn:disabled{opacity:.3;cursor:default}
.page-info{font-family:'Inter',sans-serif;font-size:13px;font-weight:700;color:var(--t1);min-width:56px;text-align:center}

/* SIDEBAR - scrolls independently */
.sidebar{border-left:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden;background:var(--bg2)}
.sidebar h4{flex-shrink:0;font-size:10px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;font-weight:700;padding:14px 12px 8px}
.thumb-list{flex:1;overflow-y:auto;padding:0 8px 8px}
.thumb-list::-webkit-scrollbar{width:3px}
.thumb-list::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.thumb-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;border:1.5px solid transparent;cursor:pointer;transition:all .2s;margin-bottom:4px}
.thumb-item:hover{border-color:var(--acc);background:var(--card)}
.thumb-item.on{border-color:var(--acc);background:var(--card)}
.thumb-item img{width:40px;height:54px;object-fit:cover;border-radius:3px;flex-shrink:0}
.thumb-item span{font-size:10.5px;color:var(--t2);font-weight:500;line-height:1.4}
.thumb-item.on span{color:var(--acc);font-weight:700}

/* 모바일 썸네일 */
.mob-thumbs{display:none;gap:6px;padding:8px 4%;overflow-x:auto;background:var(--bg2);border-top:1px solid var(--bdr)}
.mob-thumbs::-webkit-scrollbar{height:3px}
.mob-thumbs::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.mob-thumb{width:44px;height:58px;object-fit:cover;border-radius:4px;cursor:pointer;border:2px solid transparent;flex-shrink:0;opacity:.55;transition:all .2s}
.mob-thumb.on{border-color:var(--acc);opacity:1}
@media(max-width:860px){.mob-thumbs{display:flex}}

.fullscreen-btn{position:absolute;bottom:8px;right:8px;width:36px;height:36px;border-radius:8px;background:rgba(0,0,0,0.5);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;transition:background .2s}
.fullscreen-btn:hover{background:rgba(0,0,0,0.8)}
.fullscreen-btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}

.lang-dd{position:relative}
.lang-dd-btn{padding:5px 12px;border-radius:100px;border:1.5px solid var(--bdr);background:transparent;color:var(--t2);font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap}
.lang-dd-btn:hover{border-color:var(--acc);color:var(--acc)}
.lang-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:6px;min-width:160px;max-width:calc(100vw - 24px);box-shadow:0 8px 24px rgba(0,0,0,0.15);z-index:9999;display:none}
.lang-dd:hover .lang-menu,.lang-dd:focus-within .lang-menu{display:block}
.lang-opt{display:block;width:100%;padding:6px 10px;border:none;background:transparent;color:var(--t2);font-size:12px;font-weight:500;cursor:pointer;border-radius:6px;text-align:left;font-family:inherit;transition:background .15s;white-space:nowrap}
.lang-opt:hover{background:var(--bg2);color:var(--t1)}
.lang-opt.on{color:var(--acc);font-weight:700}

.ctrl-btn.ic{padding:7px 10px}
.ctrl-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.page-info{white-space:nowrap}
/* 하단 문의바 */
.mbar{display:none}
@media(max-width:560px){
  nav{gap:8px;padding:0 3%}
  .nav-sub,#langDdLabel,.back-btn .bt{display:none}
  .back-btn{padding:6px 11px}
  .lang-dd-btn{padding:5px 10px}
  .controls{gap:6px}
  .ctrl-btn{padding:7px 12px;font-size:12px}
  .ctrl-btn .ct{display:none}
}
@media(max-width:768px){
  .mbar{display:flex;flex-shrink:0;background:var(--nav);border-top:1px solid var(--bdr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:8px}
  .mbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:46px;border-radius:12px;text-decoration:none;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
  .mbar a .mi{font-size:17px;line-height:1}
  .mbar .m-call{background:#00C87A}.mbar .m-tg{background:#229ED9}.mbar .m-mail{background:#3A4A5E}
}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">Agrow</a>

    <div class="stage" id="stage">
      <div class="loading" id="loading">불러오는 중...</div>

<div class="mbar" role="navigation" aria-label="Quick contact">

  <a href="mailto:hpagrow@hanmail.net" class="m-mail" id="mbMail"><span class="mi">✉️</span><span id="mbMailT">이메일</span></a>

<script>
function getSrc(id){
  return ({en:'catalog_images_en/',ru:'catalog_images_ru/',uz:'catalog_images_uz/',zh:'catalog_images_zh/',ja:'catalog_images_ja/',vi:'catalog_images_vi/',id:'catalog_images_id/'}[curLang] || 'catalog_images/') + id + '.webp';
}
const AGROW = [
  {id:'p2', label:'Agrow 앞표지', label_en:'Agrow Front Cover'},
  {id:'p3', label:'Agrow-Perfect', label_en:'Agrow-Perfect'},
  {id:'p4', label:'Agrow-7000 Plus', label_en:'Agrow-7000 Plus'},
  {id:'p5', label:'Agrow-6000 Plus (옵션형)', label_en:'Agrow-6000 Plus (Optional)'},
  {id:'p6', label:'Agrow-6000 Plus (기본형)', label_en:'Agrow-6000 Plus (Standard)'},
  {id:'p7', label:'Agrow-7000', label_en:'Agrow-7000'},
  {id:'p8', label:'Agrow-6000', label_en:'Agrow-6000'},
  {id:'p9', label:'Agrow-5000 Master', label_en:'Agrow-5000 Master'},
  {id:'p10', label:'Agrow-5000 Magic', label_en:'Agrow-5000 Magic'},
  {id:'p11', label:'Agrow-2000 Star B형', label_en:'Agrow-2000 Star Type B'},
  {id:'p12', label:'Agrow-2000 Star A형', label_en:'Agrow-2000 Star Type A'},
  {id:'p1', label:'Agrow 뒤표지', label_en:'Agrow Back Cover'},
];
const GREEN = [
  {id:'g2', label:'A⁺-green 앞표지', label_en:'A⁺-green Front Cover'},
  {id:'g3', label:'A⁺-green 스펙 상세', label_en:'A⁺-green Specifications'},
  {id:'g4', label:'A⁺-green 설치 현장', label_en:'A⁺-green Installation'},
  {id:'g1', label:'A⁺-green 뒤표지', label_en:'A⁺-green Back Cover'},
];
const ALL = [...AGROW, ...GREEN];

const PRODUCT_PAGE = {
  perfect:     1,  // p3
  '7000plus':  2,  // p4
  '6000plus':  3,  // p5
  '7000':      5,  // p7
  '6000':      6,  // p8
  '5000master':7,  // p9
  '5000magic': 8,  // p10
  '2000b':     9,  // p11
  '2000a':    10,  // p12
  aplus:      12,  // g2 A⁺-green 앞표지
};

let pages=[...ALL], idx=0;
const params=new URLSearchParams(location.search);
const prod=params.get('product');
if(prod && PRODUCT_PAGE[prod]!=null) idx=PRODUCT_PAGE[prod];

const pageImg=document.getElementById('pageImg');
const loading=document.getElementById('loading');
const pageInfo=document.getElementById('pageInfo');
const thumbList=document.getElementById('thumbList');

function render(){
  loading.style.display='flex';
  pageImg.classList.remove('show');
  const tmp=new Image();
  const curSrc=getSrc(pages[idx].id);
  tmp.onload=()=>{pageImg.src=curSrc;pageImg.classList.add('show');loading.style.display='none';};
  tmp.src=curSrc;
  pageInfo.textContent=(idx+1)+' / '+pages.length;
  const atFirst=idx===0, atLast=idx===pages.length-1;
  document.getElementById('prevBtn').disabled=atFirst;
  document.getElementById('arrL').style.visibility=atFirst?'hidden':'visible';
  document.getElementById('nextBtn').disabled=atLast;
  document.getElementById('arrR').style.visibility=atLast?'hidden':'visible';
  document.getElementById('firstBtn').disabled=atFirst;
  document.getElementById('lastBtn').disabled=atLast;
  buildThumbs();
  updMail();
}

function buildThumbs(){
  thumbList.innerHTML='';
  pages.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='thumb-item'+(i===idx?' on':'');
    const lbl = curLang==='ko' ? p.label : (p.label_en||p.label);
    d.innerHTML='<img src="'+getSrc(p.id)+'" loading="lazy"><span>'+lbl+'</span>';
    d.onclick=()=>{idx=i;render();};
    thumbList.appendChild(d);
  });
  thumbList.children[idx]?.scrollIntoView({block:'nearest'});
  // 모바일 썸네일
  const mob=document.getElementById('mobThumbs');
  mob.innerHTML='';
  pages.forEach((p,i)=>{
    const img=document.createElement('img');
    img.src=getSrc(p.id); img.loading='lazy';
    img.className='mob-thumb'+(i===idx?' on':'');
    img.onclick=()=>{idx=i;render();};
    mob.appendChild(img);
  });
  mob.children[idx]?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

function go(d){
  const n=idx+d;
  if(n>=0&&n<pages.length){idx=n;render();}
}

// 버튼 이벤트 - preventDefault로 화면 이동 방지
['arrL','arrR','prevBtn','nextBtn','firstBtn','lastBtn'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{
    e.preventDefault();
    if(id==='arrL'||id==='prevBtn') go(-1);
    else if(id==='arrR'||id==='nextBtn') go(1);
    else if(id==='firstBtn'){idx=0;render();}
    else if(id==='lastBtn'){idx=pages.length-1;render();}
  });
});

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick=e=>{
    e.preventDefault();
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    const cat=btn.dataset.cat;
    pages=cat==='all'?[...ALL]:cat==='agrow'?[...AGROW]:[...GREEN];
    idx=0;render();
  };
});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();go(-1);}
});

// 터치 스와이프
let tx=0;
const stage=document.getElementById('stage');
stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
stage.addEventListener('touchend',e=>{
  const diff=tx-e.changedTouches[0].clientX;
  if(Math.abs(diff)>40) go(diff>0?1:-1);
},{passive:true});

let curLang='ko';
try{const q=new URLSearchParams(location.search).get('lang');curLang=(q&&CAT_I18N[q])?q:(localStorage.getItem('ag-lang')||'ko');}catch(e){}
if(!CAT_I18N[curLang])curLang='ko';
const FLAGS={'ko':'🇰🇷','en':'🇺🇸','zh':'🇨🇳','ja':'🇯🇵','ru':'🇷🇺','vi':'🇻🇳','id':'🇮🇩','uz':'🇺🇿'};
function updMail(){const t=CAT_I18N[curLang]||CAT_I18N.ko,a=document.getElementById('mbMail');if(!a||typeof pages==='undefined')return;
const pg=pages[idx]||{},nm=curLang==='ko'?pg.label:(pg.label_en||pg.label);
a.href='mailto:hpagrow@hanmail.net?subject='+encodeURIComponent(t.subj+(nm||''));}

function applyLang(lang) {
  curLang = lang;
  const t = CAT_I18N[lang] || CAT_I18N.ko;
  document.querySelector('#backBtn .bt').textContent = ' '+t.back.replace(/^←\s*/,'');
  document.getElementById('backBtn').href='index.html?lang='+lang;
  document.getElementById('langFlag').textContent=FLAGS[lang]||'🌐';
  document.getElementById('prevTxt').textContent=t.prev;document.getElementById('nextTxt').textContent=t.next;
  document.getElementById('prevBtn').title=t.prev;document.getElementById('nextBtn').title=t.next;
  document.getElementById('firstBtn').title=t.first;document.getElementById('lastBtn').title=t.last;
  document.getElementById('pgListT').textContent=t.plist;
  document.getElementById('mbCall').textContent=t.call;document.getElementById('mbMailT').textContent=t.mail;
  document.documentElement.lang=lang;
  try{localStorage.setItem('ag-lang',lang)}catch(e){}
  document.querySelector('.nav-sub').textContent = t.sub;
  document.getElementById('loading').textContent = t.loading;
  document.getElementById('langDdLabel').textContent = t.lang;
  // 탭
  const tabs = document.querySelectorAll('.tab-btn');
  tabs[0].textContent = t.all + ' ' + ALL.length + 'p';
  tabs[1].textContent = t.agrow + ' ' + AGROW.length + 'p';
  tabs[2].textContent = t.green + ' ' + GREEN.length + 'p';
  // 토글 레이블
  updateTogLabel();
  // 언어 버튼 활성화
  document.querySelectorAll('.lang-opt').forEach(o => o.classList.toggle('on', o.dataset.lang === lang));
  // 이미지 세트 전환 (영어일 때 catalog_images_en 사용)
  if (typeof pages !== 'undefined') { render(); }
}

function updateTogLabel() {
  const t = CAT_I18N[curLang] || CAT_I18N.ko;
  const isDark = document.documentElement.dataset.theme === 'dark';
  const b=document.getElementById('togBtn'),v=isDark ? t.tlight : t.tdark;
  b.title=v;b.setAttribute('aria-label',v);b.setAttribute('aria-checked',isDark?'true':'false');
}

// 다크모드
const html=document.documentElement;
try{html.dataset.theme=localStorage.getItem('ag-theme')||'light';}catch(e){}
document.getElementById('togBtn').addEventListener('click',()=>{
  const t=html.dataset.theme==='light'?'dark':'light';
  html.dataset.theme=t;try{localStorage.setItem('ag-theme',t)}catch(e){}
  updateTogLabel();
});

// 언어 메뉴 생성
const langMenu=document.getElementById('langMenu');
Object.keys(CAT_I18N).forEach(lang=>{
  const flags={'ko':'🇰🇷','en':'🇺🇸','zh':'🇨🇳','ja':'🇯🇵','ru':'🇷🇺','vi':'🇻🇳','id':'🇮🇩','uz':'🇺🇿'};
  const names={'ko':'한국어','en':'English','zh':'中文','ja':'日本語','ru':'Русский','vi':'Tiếng Việt','id':'Indonesia','uz':"O'zbek"};
  const btn=document.createElement('button');
  btn.className='lang-opt'; btn.dataset.lang=lang;
  btn.textContent=flags[lang]+' '+names[lang];
  btn.onclick=()=>applyLang(lang);
  langMenu.appendChild(btn);
});

applyLang(curLang);

render();
