<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · Agrow</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicons/icon.svg" type="image/svg+xml">
<script src="/js/ga.js"></script>
<style>
:root{--bg:#F4F6F9;--card:#fff;--t1:#0E1A2B;--t2:#5A6678;--acc:#00C87A;--acc2:#009F62}
@media(prefers-color-scheme:dark){:root{--bg:#080F1C;--card:#0D1726;--t1:#E8EEF6;--t2:#8A97AA;--acc:#00E5A0;--acc2:#00C87A}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--t1);font-family:'Inter','Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif}
.box{max-width:460px;width:100%;text-align:center;background:var(--card);border-radius:20px;padding:44px 28px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.code{font-size:72px;font-weight:800;color:var(--acc);letter-spacing:-2px;line-height:1}
.brand{margin-top:6px;font-weight:700;font-size:15px;color:var(--t2)}
h1{margin-top:22px;font-size:20px;line-height:1.4}
p{margin-top:10px;color:var(--t2);font-size:14px;line-height:1.6}
.btns{margin-top:26px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a.b{display:inline-block;padding:12px 22px;border-radius:100px;text-decoration:none;font-weight:700;font-size:14px;background:var(--acc);color:#fff}
a.b:hover{background:var(--acc2)}
a.b.s{background:transparent;color:var(--t1);border:1.5px solid var(--t2)}
.lg{display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0}
.lg .lg-sym{display:block;flex-shrink:0}
.lg-tx{display:flex;flex-direction:column;line-height:1}
.lg-k{font-family:'Noto Sans KR','Noto Sans CJK KR',sans-serif;font-weight:900;font-size:10.5px;letter-spacing:1.5px;color:var(--t1)}
.lg-w{font-family:'Inter','Noto Sans KR',sans-serif;font-weight:900;font-size:23px;letter-spacing:-1px;color:var(--t1);margin-top:2px}
</style>
</head>
<body>
<div class="box">
  <a class="lg" href="/" style="justify-content:center;margin-bottom:18px"><svg class="lg-sym" viewBox="0 0 64 64" width="40" height="40" aria-hidden="true"><defs><linearGradient id="lgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00D68A"/><stop offset="1" stop-color="#00A36C"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#lgG)"/><path d="M32 9C32 9 15 29 15 40.5A17 17 0 0 0 49 40.5C49 29 32 9 32 9Z" fill="#fff"/><path d="M32 52C32 44 33 37 41 31C40 40 37 45 32 47" fill="#00B877"/><path d="M32 52C32 46 30.5 41 24.5 37.5C25 43 27.5 46.5 32 48" fill="#E8892B"/></svg><span class="lg-tx"><span class="lg-k">한가람농업개발</span><span class="lg-w">Agrow</span></span></a>
  <div class="code">404</div>
  <h1 id="h">페이지를 찾을 수 없습니다</h1>
  <p id="d">주소가 바뀌었거나 삭제된 페이지입니다.</p>
  <div class="btns">
    <a class="b" id="home" href="/">홈으로</a>
    <a class="b s" id="ct" href="/#contact">문의하기</a>
  </div>
</div>
<script>
const M={
ko:["페이지를 찾을 수 없습니다","주소가 바뀌었거나 삭제된 페이지입니다.","홈으로","문의하기"],
en:["Page not found","The page may have moved or no longer exists.","Go to homepage","Contact us"],
ru:["Страница не найдена","Возможно, страница перемещена или удалена.","На главную","Связаться с нами"],
uz:["Sahifa topilmadi","Sahifa ko'chirilgan yoki o'chirilgan bo'lishi mumkin.","Bosh sahifa","Biz bilan bog'lanish"],
zh:["找不到页面","该页面可能已移动或不存在。","返回首页","联系我们"],
ja:["ページが見つかりません","ページが移動または削除された可能性があります。","ホームへ","お問い合わせ"],
vi:["Không tìm thấy trang","Trang có thể đã được chuyển hoặc không còn tồn tại.","Về trang chủ","Liên hệ"],
id:["Halaman tidak ditemukan","Halaman mungkin telah dipindahkan atau tidak ada lagi.","Ke beranda","Hubungi kami"]};
let l;try{l=localStorage.getItem('ag-lang')}catch(e){}
if(!M[l]){l=(navigator.languages||[navigator.language||'en']).map(x=>String(x).slice(0,2).toLowerCase()).find(x=>M[x])||'en'}
const t=M[l];document.documentElement.lang=l;
h.textContent=t[0];d.textContent=t[1];home.textContent=t[2];ct.textContent=t[3];
home.href='/?lang='+l;ct.href='/?lang='+l+'#contact';
</script>
</body>
</html>
